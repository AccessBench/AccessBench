[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessbench-environment-lab"
version = "0.17.1"
description = "Offline five-app research environment for AccessBench"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<50",
]

[project.optional-dependencies]
kms-aws = [
    "boto3>=1.35,<2",
]
dev = [
    "pytest>=8,<10",
]
hosted-api = [
    "openai>=2,<3",
]
production = [
    "openai>=2,<3",
]

[project.scripts]
accessbench = "accessbench_env.cli:main"
accessbench-env = "accessbench_env.cli:main"

[tool.setuptools]
packages = ["accessbench_env"]
