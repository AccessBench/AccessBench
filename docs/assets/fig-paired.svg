<text x="676.0" y="206.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">same answer key both arms</text>
