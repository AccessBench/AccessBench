<text x="40.0" y="312.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">Same agent, same cases, one difference. The gap between the two bars is the whole measurement.</text>
