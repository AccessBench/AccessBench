<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="A run passes every gate in order before it is eligible for publication">
<title>A run passes every gate in order before it is eligible for publication</title>
<style>
:root{--ab-ink:#14141a;--ab-ink2:#45454e;--ab-muted:#6b6b75;--ab-faint:#8a8a93;--ab-grid:#d5d5dc;--ab-line:#a0a0aa;--ab-arrowmuted:#b0b0ba;--ab-panel:#f7f7f9;--ab-panel2:#f1f1f4;--ab-inputbg:#f4f4f7;--ab-inputst:#d2d2da;--ab-testbg:#fcf1f4;--ab-testst:#d59cac;--ab-passbg:#f0f8f1;--ab-passst:#9fcda3;--ab-sealedbg:#e9e9ef;--ab-sealedst:#c4c4ce;--ab-outbg:#f5f5f8;--ab-outst:#bcbcc6;--ab-chipbg:#eeeef2;--ab-chipst:#d5d5dd;--ab-chiptestbg:#fbeef1;--ab-chippassbg:#eef7ef;--ab-chipsealbg:#e7e7ed;--ab-chipsealst:#c8c8d2;--ab-scarlet:#a02347;--ab-brandtx:#8f1f3f;--ab-good:#128012;--ab-goodtx:#14761a;--ab-ctrlbar:#9a9aa4;--ab-stackbg:#eeeef2;--ab-stackst:#ccccd6;--ab-gridread:#c6c6ce;--ab-gridegress:#8e8e9a;--ab-agent:#1f7a4d;--ab-brandred:#c9364f;--ab-room:#1b1b21;--ab-face:#e6e6eb;--ab-faceedge:#b9b9c4;--ab-celllit:#9a9aa6;--ab-cellblack:#0f0f13;--ab-cellblkedge:#5a5a66;--ab-framefill:#dcdce3;--ab-frameedge:#aeaeba;--ab-slab:#d4d4dc;--ab-slabedge:#a8a8b4;--ab-rail:#dcdce3;--ab-hinge:#9a9aa6;--ab-handle:#7a7a86;--ab-roomA:#15151b;--ab-roomB:#24242c;--ab-roomC:#35353f;--ab-reveal:#44444f;}
@media (prefers-color-scheme:dark){:root{--ab-ink:#f4f4f2;--ab-ink2:#b9b9bd;--ab-muted:#83838b;--ab-faint:#6e6e77;--ab-grid:#2a2a2e;--ab-line:#4a4a52;--ab-arrowmuted:#5c5c65;--ab-panel:#16161a;--ab-panel2:#141418;--ab-inputbg:#141419;--ab-inputst:#3a3a42;--ab-testbg:#1c1319;--ab-testst:#7d2038;--ab-passbg:#101a11;--ab-passst:#245c28;--ab-sealedbg:#060607;--ab-sealedst:#2f2f36;--ab-outbg:#17171c;--ab-outst:#4a4a52;--ab-chipbg:#1d1d23;--ab-chipst:#3a3a44;--ab-chiptestbg:#22141a;--ab-chippassbg:#111b12;--ab-chipsealbg:#0b0b0d;--ab-chipsealst:#33333c;--ab-scarlet:#c9364f;--ab-brandtx:#e3899a;--ab-good:#0ca30c;--ab-goodtx:#5fbf5f;--ab-ctrlbar:#8a8a93;--ab-stackbg:#1d1d23;--ab-stackst:#3f3f4a;--ab-gridread:#3d3d47;--ab-gridegress:#7d7d8b;--ab-agent:#34a06a;--ab-brandred:#c9364f;--ab-room:#08080c;--ab-face:#2c2c36;--ab-faceedge:#5a5a67;--ab-celllit:#dcdce0;--ab-cellblack:#08080a;--ab-cellblkedge:#4d4d59;--ab-framefill:#262630;--ab-frameedge:#3e3e4a;--ab-slab:#2b2b33;--ab-slabedge:#4a4a56;--ab-rail:#33333d;--ab-hinge:#5b5b66;--ab-handle:#b9b9bd;--ab-roomA:#050506;--ab-roomB:#0c0c10;--ab-roomC:#17171d;--ab-reveal:#24242c;}}
</style>
<defs><linearGradient id="brandgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ab-scarlet)"/><stop offset="1" stop-color="var(--ab-brandtx)"/></linearGradient><marker id="ah-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-line)"/></marker><marker id="ah-scarlet" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-scarlet)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-good)"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-agent)"/></marker><marker id="ah-brandred" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-brandred)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-arrowmuted)"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-ink2)"/></marker></defs>
<rect x="40" y="30" width="48" height="2.5" rx="1.25" fill="url(#brandgrad)"/>
<text x="40.0" y="58.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="15.5" font-weight="600" text-anchor="start" letter-spacing="0.2" style="fill:var(--ab-ink)">The gates a result has to clear</text>
<text x="40.0" y="75.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">In order. Any one of them failing ends the run&#x27;s claim.</text>
<rect x="40.0" y="100.0" width="195.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="137.5" y="134.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Signed first</text>
<text x="137.5" y="149.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">config and code, before inference</text>
<line x1="235.0" y1="137.0" x2="245.0" y2="137.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="250.0" y="100.0" width="195.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="347.5" y="134.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Deterministic</text>
<text x="347.5" y="149.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">tests green, panel rebuilds exactly</text>
<line x1="445.0" y1="137.0" x2="455.0" y2="137.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="460.0" y="100.0" width="195.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="557.5" y="134.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Split release</text>
<text x="557.5" y="149.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">private bank regenerated and compared</text>
<line x1="655.0" y1="137.0" x2="665.0" y2="137.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="670.0" y="100.0" width="195.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="767.5" y="134.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Evidence</text>
<text x="767.5" y="149.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">every episode once, chain intact</text>
<path d="M835.0 174.0 L849.0 174.0 Q862.0 174.0 862.0 187.0 L862.0 187.0 Q862.0 200.0 849.0 200.0 L41.0 200.0 Q28.0 200.0 28.0 213.0 L28.0 213.0 Q28.0 226.0 32.0 226.0 L36.0 226.0" fill="none" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="40.0" y="226.0" width="195.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="137.5" y="260.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Identity</text>
<text x="137.5" y="275.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">signer in an independent registry</text>
<line x1="235.0" y1="263.0" x2="245.0" y2="263.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="250.0" y="226.0" width="195.0" height="74.0" rx="8" style="fill:var(--ab-testbg);stroke:var(--ab-testst);stroke-width:1"/>
<text x="347.5" y="260.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Anti-Cheat</text>
<text x="347.5" y="275.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">Valid, Flagged, or Ineligible</text>
<circle cx="434.0" cy="237.0" r="3" style="fill:var(--ab-scarlet)"/>
<line x1="445.0" y1="263.0" x2="455.0" y2="263.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="460.0" y="226.0" width="195.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="557.5" y="260.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Isolation</text>
<text x="557.5" y="275.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">throwaway box, network denied</text>
<line x1="655.0" y1="263.0" x2="665.0" y2="263.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="670.0" y="226.0" width="195.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="767.5" y="260.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Spend</text>
<text x="767.5" y="275.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">a hosted run needs an explicit yes</text>
<path d="M835.0 300.0 L849.0 300.0 Q862.0 300.0 862.0 313.0 L862.0 313.0 Q862.0 326.0 849.0 326.0 L463.0 326.0 Q450.0 326.0 450.0 335.0 L450.0 344.0" fill="none" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="280.0" y="350.0" width="340.0" height="62.0" rx="8" style="fill:var(--ab-passbg);stroke:var(--ab-passst);stroke-width:1"/>
<text x="450.0" y="385.9" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Publication eligible</text>
<circle cx="609.0" cy="361.0" r="3" style="fill:var(--ab-good)"/>
<text x="640.0" y="372.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11" font-weight="400" text-anchor="start" style="fill:var(--ab-brandtx)">core-v2 can never set this.</text>
<text x="640.0" y="389.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">No admitted sealed pack exists yet.</text>
</svg>
