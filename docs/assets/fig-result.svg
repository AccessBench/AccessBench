<text x="40.0" y="58.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="15.5" font-weight="600" text-anchor="start" letter-spacing="0.2" style="fill:var(--ab-ink)">What one run hands back</text>
