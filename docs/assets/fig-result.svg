<path d="M200.0 273.0 L222.0 273.0 Q232.0 273.0 232.0 263.0 L232.0 211.0 Q232.0 201.0 242.0 201.0 L262.0 201.0" fill="none" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="270.0" y="166.0" width="150.0" height="70.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="345.0" y="198.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">One run</text>
<text x="345.0" y="213.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">1,200 episodes</text>
<line x1="420.0" y1="201.0" x2="466.0" y2="201.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="474.0" y="96.0" width="250.0" height="210.0" rx="8" style="fill:var(--ab-panel2);stroke:var(--ab-grid);stroke-width:1"/>
<text x="492.0" y="122.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--ab-ink)">One signed file</text>
<text x="492.0" y="139.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10.5" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">the runner can verify it locally</text>
