<text x="120.0" y="278.1" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">the control, always run</text>
<text x="120.0" y="292.3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-ink2)">built in</text>
