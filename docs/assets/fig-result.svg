<rect x="766.0" y="260.0" width="81.6" height="22.0" rx="11.0" style="fill:var(--ab-chiptestbg);stroke:var(--ab-testst);stroke-width:1"/>
<text x="806.8" y="274.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.6" font-weight="400" text-anchor="middle" style="fill:var(--ab-brandtx)">Ineligible</text>
<text x="40.0" y="336.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">No integrity state ever changes the score. The two sections are read separately and reported together.</text>
