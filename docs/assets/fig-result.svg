<text x="120.0" y="213.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">the layer under test</text>
