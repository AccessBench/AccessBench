<text x="506.0" y="174.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="12.5" font-weight="600" text-anchor="start" style="fill:var(--ab-ink)">Score</text>
<text x="506.0" y="190.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">percent first, counts underneath</text>
<rect x="492.0" y="224.0" width="214.0" height="62.0" rx="6" style="fill:var(--ab-chiptestbg);stroke:var(--ab-testst);stroke-width:1"/>
<text x="506.0" y="246.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="12.5" font-weight="600" text-anchor="start" style="fill:var(--ab-ink)">Anti-Cheat</text>
<text x="506.0" y="262.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">status, evidence, reason codes</text>
<line x1="724.0" y1="255.0" x2="762.0" y2="255.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="766.0" y="200.0" width="49.8" height="22.0" rx="11.0" style="fill:var(--ab-chippassbg);stroke:var(--ab-passst);stroke-width:1"/>
<text x="790.9" y="214.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.6" font-weight="400" text-anchor="middle" style="fill:var(--ab-goodtx)">Valid</text>
<rect x="766.0" y="230.0" width="62.5" height="22.0" rx="11.0" style="fill:var(--ab-chipbg);stroke:var(--ab-chipst);stroke-width:1"/>
