<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-label="The panel is selected, padded, encrypted per record, scheduled by opaque handle, and verified at aggregation">
<title>The panel is selected, padded, encrypted per record, scheduled by opaque handle, and verified at aggregation</title>
<style>
:root{--ab-ink:#14141a;--ab-ink2:#45454e;--ab-muted:#6b6b75;--ab-faint:#8a8a93;--ab-grid:#d5d5dc;--ab-line:#a0a0aa;--ab-arrowmuted:#b0b0ba;--ab-panel:#f7f7f9;--ab-panel2:#f1f1f4;--ab-inputbg:#f4f4f7;--ab-inputst:#d2d2da;--ab-testbg:#fcf1f4;--ab-testst:#d59cac;--ab-passbg:#f0f8f1;--ab-passst:#9fcda3;--ab-sealedbg:#e9e9ef;--ab-sealedst:#c4c4ce;--ab-outbg:#f5f5f8;--ab-outst:#bcbcc6;--ab-chipbg:#eeeef2;--ab-chipst:#d5d5dd;--ab-chiptestbg:#fbeef1;--ab-chippassbg:#eef7ef;--ab-chipsealbg:#e7e7ed;--ab-chipsealst:#c8c8d2;--ab-scarlet:#a02347;--ab-brandtx:#8f1f3f;--ab-good:#128012;--ab-goodtx:#14761a;--ab-ctrlbar:#9a9aa4;--ab-stackbg:#eeeef2;--ab-stackst:#ccccd6;--ab-gridread:#c6c6ce;--ab-gridegress:#8e8e9a;--ab-agent:#1f7a4d;--ab-brandred:#c9364f;--ab-room:#1b1b21;--ab-face:#e6e6eb;--ab-faceedge:#b9b9c4;--ab-celllit:#9a9aa6;--ab-cellblack:#0f0f13;--ab-cellblkedge:#5a5a66;--ab-framefill:#dcdce3;--ab-frameedge:#aeaeba;--ab-slab:#d4d4dc;--ab-slabedge:#a8a8b4;--ab-rail:#dcdce3;--ab-hinge:#9a9aa6;--ab-handle:#7a7a86;--ab-roomA:#15151b;--ab-roomB:#24242c;--ab-roomC:#35353f;--ab-reveal:#44444f;}
@media (prefers-color-scheme:dark){:root{--ab-ink:#f4f4f2;--ab-ink2:#b9b9bd;--ab-muted:#83838b;--ab-faint:#6e6e77;--ab-grid:#2a2a2e;--ab-line:#4a4a52;--ab-arrowmuted:#5c5c65;--ab-panel:#16161a;--ab-panel2:#141418;--ab-inputbg:#141419;--ab-inputst:#3a3a42;--ab-testbg:#1c1319;--ab-testst:#7d2038;--ab-passbg:#101a11;--ab-passst:#245c28;--ab-sealedbg:#060607;--ab-sealedst:#2f2f36;--ab-outbg:#17171c;--ab-outst:#4a4a52;--ab-chipbg:#1d1d23;--ab-chipst:#3a3a44;--ab-chiptestbg:#22141a;--ab-chippassbg:#111b12;--ab-chipsealbg:#0b0b0d;--ab-chipsealst:#33333c;--ab-scarlet:#c9364f;--ab-brandtx:#e3899a;--ab-good:#0ca30c;--ab-goodtx:#5fbf5f;--ab-ctrlbar:#8a8a93;--ab-stackbg:#1d1d23;--ab-stackst:#3f3f4a;--ab-gridread:#3d3d47;--ab-gridegress:#7d7d8b;--ab-agent:#34a06a;--ab-brandred:#c9364f;--ab-room:#08080c;--ab-face:#2c2c36;--ab-faceedge:#5a5a67;--ab-celllit:#dcdce0;--ab-cellblack:#08080a;--ab-cellblkedge:#4d4d59;--ab-framefill:#262630;--ab-frameedge:#3e3e4a;--ab-slab:#2b2b33;--ab-slabedge:#4a4a56;--ab-rail:#33333d;--ab-hinge:#5b5b66;--ab-handle:#b9b9bd;--ab-roomA:#050506;--ab-roomB:#0c0c10;--ab-roomC:#17171d;--ab-reveal:#24242c;}}
</style>
<defs><linearGradient id="brandgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ab-scarlet)"/><stop offset="1" stop-color="var(--ab-brandtx)"/></linearGradient><marker id="ah-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-line)"/></marker><marker id="ah-scarlet" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-scarlet)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-good)"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-agent)"/></marker><marker id="ah-brandred" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-brandred)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-arrowmuted)"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-ink2)"/></marker></defs>
<rect x="40" y="30" width="48" height="2.5" rx="1.25" fill="url(#brandgrad)"/>
<text x="40.0" y="58.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="15.5" font-weight="600" text-anchor="start" letter-spacing="0.2" style="fill:var(--ab-ink)">The life of a sealed pack</text>
<text x="40.0" y="75.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">The runner does the work without learning which case it is doing.</text>
<rect x="40.0" y="100.0" width="190.0" height="72.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="135.0" y="133.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Select the panel</text>
<text x="135.0" y="148.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">the exact 600 cases</text>
<rect x="250.0" y="100.0" width="190.0" height="72.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="345.0" y="133.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Shuffle and pad</text>
<text x="345.0" y="148.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">every record to 64 KiB</text>
<rect x="460.0" y="100.0" width="190.0" height="72.0" rx="8" style="fill:var(--ab-sealedbg);stroke:var(--ab-sealedst);stroke-width:1"/>
<text x="555.0" y="133.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Encrypt per record</text>
<text x="555.0" y="148.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">its own nonce and seal</text>
<rect x="670.0" y="100.0" width="190.0" height="72.0" rx="8" style="fill:var(--ab-sealedbg);stroke:var(--ab-sealedst);stroke-width:1"/>
<text x="765.0" y="133.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Schedule by handle</text>
<text x="765.0" y="148.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">the runner sees a number</text>
<line x1="230.0" y1="136.0" x2="240.0" y2="136.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<line x1="440.0" y1="136.0" x2="450.0" y2="136.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<line x1="650.0" y1="136.0" x2="660.0" y2="136.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<line x1="555.0" y1="172.0" x2="555.0" y2="196.0" style="stroke:var(--ab-arrowmuted);stroke-width:1.3;stroke-dasharray:4 4;stroke-linecap:round"/>
<rect x="390.0" y="198.0" width="330.0" height="46.0" rx="7" style="fill:var(--ab-sealedbg);stroke:var(--ab-sealedst);stroke-width:1"/>
<text x="405.0" y="218.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">the plaintext index carries only</text>
<rect x="405.0" y="224.0" width="47.8" height="19.0" rx="9.5" style="fill:var(--ab-chipsealbg);stroke:var(--ab-chipsealst);stroke-width:1"/>
<text x="428.9" y="236.9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.4" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">handle</text>
<rect x="460.8" y="224.0" width="47.8" height="19.0" rx="9.5" style="fill:var(--ab-chipsealbg);stroke:var(--ab-chipsealst);stroke-width:1"/>
<text x="484.8" y="236.9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.4" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">offset</text>
<rect x="516.7" y="224.0" width="47.8" height="19.0" rx="9.5" style="fill:var(--ab-chipsealbg);stroke:var(--ab-chipsealst);stroke-width:1"/>
<text x="540.6" y="236.9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.4" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">length</text>
<rect x="572.5" y="224.0" width="42.2" height="19.0" rx="9.5" style="fill:var(--ab-chipsealbg);stroke:var(--ab-chipsealst);stroke-width:1"/>
<text x="593.6" y="236.9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.4" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">nonce</text>
<rect x="40.0" y="266.0" width="820.0" height="92.0" rx="8" style="fill:var(--ab-passbg);stroke:var(--ab-passst);stroke-width:1"/>
<text x="58.0" y="292.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="13.5" font-weight="600" text-anchor="start" style="fill:var(--ab-ink)">Verified at aggregation</text>
<text x="842.0" y="292.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10.6" font-weight="400" text-anchor="end" style="fill:var(--ab-muted)">all four, or the run does not count</text>
<rect x="58.0" y="306.0" width="205.2" height="22.0" rx="11.0" style="fill:var(--ab-chippassbg);stroke:var(--ab-passst);stroke-width:1"/>
<text x="160.6" y="320.6" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10" font-weight="400" text-anchor="middle" style="fill:var(--ab-goodtx)">signed run matches the sealed digest</text>
<rect x="271.2" y="306.0" width="174.0" height="22.0" rx="11.0" style="fill:var(--ab-chippassbg);stroke:var(--ab-passst);stroke-width:1"/>
<text x="358.2" y="320.6" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10" font-weight="400" text-anchor="middle" style="fill:var(--ab-goodtx)">every handle used exactly once</text>
<rect x="58.0" y="332.0" width="184.4" height="22.0" rx="11.0" style="fill:var(--ab-chippassbg);stroke:var(--ab-passst);stroke-width:1"/>
<text x="150.2" y="346.6" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10" font-weight="400" text-anchor="middle" style="fill:var(--ab-goodtx)">each handle resolves to one case</text>
<rect x="250.4" y="332.0" width="226.0" height="22.0" rx="11.0" style="fill:var(--ab-chippassbg);stroke:var(--ab-passst);stroke-width:1"/>
<text x="363.4" y="346.6" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10" font-weight="400" text-anchor="middle" style="fill:var(--ab-goodtx)">answer key replayed from a separate copy</text>
<text x="40.0" y="382.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">Sealing removes the assignment leak. On its own it is not a security boundary.</text>
</svg>
