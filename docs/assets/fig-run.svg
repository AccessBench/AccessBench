<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Two inputs enter the harness, the same 600 cases run twice, one signed results file comes out">
<title>Two inputs enter the harness, the same 600 cases run twice, one signed results file comes out</title>
<style>
