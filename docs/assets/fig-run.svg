<line x1="212.0" y1="199.0" x2="292.0" y2="179.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="300.0" y="86.0" width="300.0" height="150.0" rx="8" style="fill:var(--ab-panel2);stroke:var(--ab-grid);stroke-width:1"/>
<text x="316.0" y="110.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="start" style="fill:var(--ab-ink)">AccessBench</text>
<text x="316.0" y="127.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10.8" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">600 fixed cases, run once per arm</text>
<rect x="316.0" y="142.0" width="268.0" height="36.0" rx="6" style="fill:var(--ab-chipbg);stroke:var(--ab-chipst);stroke-width:1"/>
<text x="330.0" y="164.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" style="fill:var(--ab-ink2)">no enforcement</text>
<text x="570.0" y="164.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="end" style="fill:var(--ab-muted)">control</text>
<rect x="316.0" y="186.0" width="268.0" height="36.0" rx="6" style="fill:var(--ab-chiptestbg);stroke:var(--ab-testst);stroke-width:1"/>
<text x="330.0" y="208.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" style="fill:var(--ab-brandtx)">enforcement on</text>
<text x="570.0" y="208.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="end" style="fill:var(--ab-muted)">under test</text>
<line x1="600.0" y1="161.0" x2="686.0" y2="161.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<rect x="694.0" y="118.0" width="168.0" height="86.0" rx="8" style="fill:var(--ab-outbg);stroke:var(--ab-outst);stroke-width:1"/>
<text x="778.0" y="151.1" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Signed result</text>
<text x="778.0" y="166.1" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">one file, percent first</text>
<text x="778.0" y="180.3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-ink2)">summary.json</text>
<text x="40.0" y="254.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">The pair is the point. A single number with nothing to compare it against is not a result.</text>
</svg>
