<text x="126.0" y="211.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">the layer under test</text>
<circle cx="201.0" cy="179.0" r="3" style="fill:var(--ab-scarlet)"/>
