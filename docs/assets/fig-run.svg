<rect x="40" y="30" width="48" height="2.5" rx="1.25" fill="url(#brandgrad)"/>
<text x="40.0" y="58.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="15.5" font-weight="600" text-anchor="start" letter-spacing="0.2" style="fill:var(--ab-ink)">One run, end to end</text>
<rect x="40.0" y="92.0" width="172.0" height="62.0" rx="8" style="fill:var(--ab-inputbg);stroke:var(--ab-inputst);stroke-width:1"/>
