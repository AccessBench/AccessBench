<defs><linearGradient id="brandgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ab-scarlet)"/><stop offset="1" stop-color="var(--ab-brandtx)"/></linearGradient><marker id="ah-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-line)"/></marker><marker id="ah-scarlet" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-scarlet)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-good)"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-agent)"/></marker><marker id="ah-brandred" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-brandred)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-arrowmuted)"/></marker><marker id="ah-ink2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0 0.7 L9.6 5 L0 9.3 Z" style="fill:var(--ab-ink2)"/></marker></defs>
<rect x="40" y="30" width="48" height="2.5" rx="1.25" fill="url(#brandgrad)"/>
<text x="40.0" y="58.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="15.5" font-weight="600" text-anchor="start" letter-spacing="0.2" style="fill:var(--ab-ink)">How one case runs</text>
<text x="40.0" y="75.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">The enforcement layer answers one event at a time. Everything else is fixed machinery.</text>
<rect x="380.0" y="108.0" width="200.0" height="60.0" rx="8" style="fill:var(--ab-testbg);stroke:var(--ab-testst);stroke-width:1"/>
<text x="480.0" y="135.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Enforcement</text>
<text x="480.0" y="150.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">allow, deny, or rewrite</text>
<circle cx="569.0" cy="119.0" r="3" style="fill:var(--ab-scarlet)"/>
<rect x="40.0" y="194.0" width="166.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="123.0" y="228.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Request and world</text>
<text x="123.0" y="243.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">the task, and the data behind it</text>
<rect x="224.0" y="194.0" width="156.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="302.0" y="228.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Agent picks a move</text>
<text x="302.0" y="243.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">one tool action</text>
<rect x="398.0" y="194.0" width="146.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="471.0" y="228.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Boundary event</text>
<text x="471.0" y="243.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">a read or an egress</text>
<rect x="562.0" y="194.0" width="146.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="635.0" y="228.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">App commits</text>
<text x="635.0" y="243.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">only what came back allowed</text>
<rect x="726.0" y="194.0" width="146.0" height="74.0" rx="8" style="fill:var(--ab-panel);stroke:var(--ab-grid);stroke-width:1"/>
<text x="799.0" y="228.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="middle" style="fill:var(--ab-ink)">Grader</text>
<text x="799.0" y="243.5" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.2" font-weight="400" text-anchor="middle" style="fill:var(--ab-muted)">task done, nothing leaked</text>
<line x1="206.0" y1="231.0" x2="218.0" y2="231.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<line x1="380.0" y1="231.0" x2="392.0" y2="231.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<line x1="544.0" y1="231.0" x2="556.0" y2="231.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<line x1="708.0" y1="231.0" x2="720.0" y2="231.0" style="stroke:var(--ab-line);stroke-width:1.5;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<line x1="452.0" y1="194.0" x2="452.0" y2="174.0" style="stroke:var(--ab-line);stroke-width:1.6;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<line x1="508.0" y1="170.0" x2="508.0" y2="190.0" style="stroke:var(--ab-line);stroke-width:1.6;stroke-linecap:round" marker-end="url(#ah-ink)"/>
<text x="524.0" y="186.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="10" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">the answer comes back</text>
<text x="40.0" y="296.0" font-family="Charter, 'Charter BT', 'Bitstream Charter', 'Charis SIL', ui-serif, Georgia, serif" font-size="11.4" font-weight="400" text-anchor="start" style="fill:var(--ab-muted)">The grader checks two things at once: whether the work got done, and whether a protected value left.</text>
</svg>
