name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-lab-tests:
    name: Environment Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: environment_lab/requirements-lock.txt
      - name: Install environment_lab
        working-directory: environment_lab
        run: |
          pip install -r requirements-lock.txt pytest
          pip install -e . --no-deps
      - name: Generate public catalog
        working-directory: environment_lab
        run: python -m accessbench_env generate --split public --out catalog/public.jsonl
      - name: Run environment_lab test suite
        working-directory: environment_lab
        run: python -m pytest tests -v
